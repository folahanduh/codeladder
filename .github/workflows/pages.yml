# Publishes Code Ladder to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Two jobs, as in GitHub's own Pages template: "build" uploads the site, then "deploy" publishes it.
# Deploying in the same job straight after the upload races GitHub's artifact listing and can fail
# with "No artifacts named github-pages were found".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build lessons from Markdown
        run: npm run build
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
