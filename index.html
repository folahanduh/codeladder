<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A self-paced coding school: web development, cryptography, smart contracts and tokenomics from beginner to advanced.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232747E0'/%3E%3Cpath d='M10 5v22M22 5v22' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M10 10h12M10 16h12M10 22h12' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <span class="bars" aria-hidden="true"></span>
  </button>
  <a class="brand" href="#home" aria-label="Code Ladder home">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 2v20M18 2v20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M6 17h12" stroke="var(--beg)" stroke-width="2.6"/>
      <path d="M6 12h12" stroke="var(--int)" stroke-width="2.6"/>
      <path d="M6 7h12" stroke="var(--adv)" stroke-width="2.6"/>
    </svg>
    <span>Code Ladder</span>
  </a>
  <div class="search" role="search">
    <label class="sr-only" for="searchInput">Search</label>
    <input id="searchInput" type="search" placeholder="Search lessons, tools, terms" autocomplete="off" spellcheck="false">
    <kbd class="search-key" aria-hidden="true">/</kbd>
    <div class="search-results" id="searchResults" role="listbox" hidden></div>
  </div>
  <a class="xp-chip" href="#progress" id="xpChip" title="Your progress">0 XP</a>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme" title="Theme: system">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Code Ladder needs JavaScript switched on.</p></noscript>

<!-- Syntax highlighting: highlight.js 11.9.0, bundled locally so the site works offline (BSD-3 licence in assets/vendor) -->
<script src="assets/vendor/highlight.min.js"></script>
<!-- Lessons (generated from /content by `npm run build`), reference data, interactive tools, app -->
<script src="assets/content.js"></script>
<script src="assets/data.js"></script>
<script src="assets/tools.js"></script>
<script src="assets/exercises.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
